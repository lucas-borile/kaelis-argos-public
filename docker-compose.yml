services:
  argos-db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: argos
      POSTGRES_USER: argos
      POSTGRES_PASSWORD: argos
    volumes:
      - argos-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argos -d argos"]
      interval: 5s
      timeout: 5s
      retries: 20

  spmu-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://argos:argos@argos-db:5432/argos
    ports:
      - "8000:8000"
    depends_on:
      argos-db:
        condition: service_healthy

  spmu-frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - spmu-backend

volumes:
  argos-postgres-data:
